name: Deploy MEFIE

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Django
        run: |
          python manage.py check

      - name: Sincronizar con Lavallol
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LAVALLOL_USER }}@${{ secrets.LAVALLOL_HOST }} "cd blue_sky_app && git pull origin develop"
